name: Build house screen app
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the app
        run: |
          echo "Files in the repo:"; find . -path ./.git -prune -o -type f -print | head -50
          S="$(find . -path ./.git -prune -o -name 'settings.gradle*' -print | head -1)"
          if [ -z "$S" ]; then echo "NO settings.gradle FOUND - the app files are not in the repo"; exit 1; fi
          echo "APP=$(dirname "$S")" >> "$GITHUB_ENV"
          echo "App folder: $(dirname "$S")"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: ${{ env.APP }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the file
        working-directory: ${{ env.APP }}
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/house-screen.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: house-screen
          path: house-screen.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: House Screen (latest)
          make_latest: true
          files: house-screen.apk
