name: Build house screen app
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: house-screen-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the Android parts
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk house-screen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: house-screen
          path: house-screen-app/house-screen.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: House Screen (latest)
          make_latest: true
          files: house-screen-app/house-screen.apk
