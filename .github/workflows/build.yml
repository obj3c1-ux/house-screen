name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --no-daemon -PworkerUrl="${{ vars.WORKER_URL || secrets.WORKER_URL }}"
      - run: cp app/build/outputs/apk/debug/app-debug.apk house-screen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: house-screen
          path: house-screen.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: House Screen (latest)
          files: house-screen.apk
